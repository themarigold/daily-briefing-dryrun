<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- T22 menubar TEMPLATE icon — hand-authored (docs/gui-seam.md §14). BLACK + ALPHA ONLY:
       pure #000 fills/strokes on a transparent canvas, so every rendered pixel is black with
       the antialiasing carried in the alpha channel — macOS recolours it for light, dark and
       tinted menu bars (shell.rs sets icon_as_template(true)). The 18×18 canvas is DELIBERATE,
       not the appendix's 16pt: tray-icon 0.24.2 forces menu-bar images to 18pt logical height
       (platform_impl/macos/mod.rs, icon_height = 18.0 — the measurement shell.rs's
       TRAY_ICON_PNG note records), so 18px @1x / 36px @2x render pixel-perfect where 16/32
       would be upscaled soft (deviation 146). tests/icons.rs pixel-scans the rendered PNGs;
       gui/scripts/generate-branding.sh regenerates them — edit HERE, never the PNGs. -->
  <g stroke="#000" stroke-width="1.5" stroke-linecap="round">
    <line x1="14.4" y1="9" x2="16.4" y2="9"/>
    <line x1="1.6" y1="9" x2="3.6" y2="9"/>
    <line x1="9" y1="14.4" x2="9" y2="16.4"/>
    <line x1="9" y1="1.6" x2="9" y2="3.6"/>
    <line x1="12.82" y1="12.82" x2="14.23" y2="14.23"/>
    <line x1="3.77" y1="3.77" x2="5.18" y2="5.18"/>
    <line x1="12.82" y1="5.18" x2="14.23" y2="3.77"/>
    <line x1="3.77" y1="14.23" x2="5.18" y2="12.82"/>
  </g>
  <circle cx="9" cy="9" r="3.4" fill="#000"/>
</svg>
